plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'info.journeymap'
        }
    }
    maven {
        name = 'FTB'
        url = 'https://maven.ftb.dev/releases'
        content { includeGroup 'dev.ftb.mods' }
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
        content { includeGroup 'dev.architectury' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup 'software.bernie.geckolib'
        }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            gameDirectory = project.file('build/recipe-datagen')
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            jvmArguments.addAll '-Xmx10G', '-Xms2G'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Optional integration fixture using the same Alex's Caves/Citadel jars as the development client.
    if (providers.gradleProperty('alexCavesGameTests').isPresent()) {
        localRuntime fileTree('run/mods') { include 'alexscaves-*.jar', 'citadel-*.jar' }
    }
    implementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:${geckolib_version}"
    compileOnly "maven.modrinth:jade:15.10.0+neoforge"
    compileOnly 'mezz.jei:jei-1.21.1-common-api:19.32.0.359'
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.32.0.359'
    compileOnly 'maven.modrinth:emi:1.1.24+1.21.1+neoforge'
    // Only touched from dev.compat.emi.EmiOresDeposits, after a ModList check.
    compileOnly('maven.modrinth:emi-ores:1.3+1.21.1+neoforge') { transitive = false }
    // Map integrations: every class touching these APIs is loaded only after a ModList check.
    compileOnly('info.journeymap:journeymap-api-neoforge:2.0.0-1.21.1') { transitive = false }
    compileOnly('maven.modrinth:xaeros-world-map:neoforge-1.21.1-1.44.2') { transitive = false }
    compileOnly('maven.modrinth:xaeros-minimap:neoforge-1.21.1-26.4.2') { transitive = false }
    compileOnly('dev.ftb.mods:ftb-chunks-neoforge:2101.1.22') { transitive = false }
    compileOnly('dev.ftb.mods:ftb-library-neoforge:2101.1.35') { transitive = false }
    compileOnly('dev.architectury:architectury-neoforge:13.0.8') { transitive = false }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Same Gson as Minecraft 1.21.1, for tests of code that walks encoded worldgen JSON.
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// Opt-in integration tests run in an isolated world and stay out of the published mod jar.
// ./gradlew runGameTestServer -PcompactGameTests
if (providers.gradleProperty('compactGameTests').isPresent()) {
    def gameTests = sourceSets.create('gameTest') {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
    neoForge.mods.named(project.mod_id) {
        sourceSet gameTests
    }
    neoForge.runs.create('gameTestServer') {
        type = 'gameTestServer'
        sourceSet = gameTests
        gameDirectory = project.file('build/compact-gametest')
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        jvmArgument '-Xmx2G'
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            geckolib_version       : geckolib_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
